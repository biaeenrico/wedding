<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96" />
    </clipPath>
    <style>
      /* Ensure a transparent background outside rounded area */
      svg { background: transparent; }
    </style>
  </defs>
  <image href="logo.png" width="512" height="512" preserveAspectRatio="xMidYMid slice" clip-path="url(#round)" />
</svg>
